<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten a link</title>
<style>
  :root {
    --bg: #f3f6fb;
    --surface: #ffffff;
    --ink: #10203a;
    --muted: #5b6b84;
    --line: #d5deec;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --error: #b42318;
    --ok: #0f7a4a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1626;
      --surface: #15223a;
      --ink: #e8eefb;
      --muted: #9aaac6;
      --line: #2a3b5c;
      --accent: #6d93ff;
      --accent-ink: #0d1626;
      --error: #ff8a80;
      --ok: #5fd39a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  main { width: 100%; max-width: 560px; }

  h1 {
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  .lead { margin: 0 0 28px; color: var(--muted); }
  
  .note {
    color: red;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 10px 12px;
  }
  
  input:focus { outline: none; }
  form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { margin: 14px 4px 0; min-height: 1.4em; font-size: .95rem; }
  #msg.error { color: var(--error); }
  #result {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ok);
    border-radius: 12px;
  }
  #result.show { display: block; }
  #result small { display: block; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row a {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    color: var(--accent);
    font-weight: 600;
    font-size: 1.1rem;
  }
  .row button { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  @media (max-width: 440px) {
    form { flex-direction: column; }
    button { width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #result.show { animation: pop .2s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main>
  <h1>Shorten a link</h1>
  <p class="lead">Paste a long URL and get a short one you can share.</p>
  <p class="note">Note: This URL will remain active for only 14 days, after which it will be automatically removed from the system.</p>

  <form id="form">
    <input id="url" type="text" placeholder="https://example.com/a/very/long/page" aria-label="Long URL" autocomplete="off" required>
    <button id="btn" type="submit">Shorten</button>
  </form>
  <p id="msg" role="status"></p>

  <section id="result" aria-live="polite">
    <small>Your short link</small>
    <div class="row">
      <a id="short" href="#" target="_blank" rel="noopener"></a>
      <button id="copy" type="button">Copy</button>
    </div>
  </section>
</main>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("url");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const result = document.getElementById("result");
  const shortLink = document.getElementById("short");
  const copyBtn = document.getElementById("copy");

  function setMsg(text, isError) {
    msg.textContent = text;
    msg.className = isError ? "error" : "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    result.classList.remove("show");
    setMsg("");

    if (window.location.protocol === "file:") {
      setMsg("Run the app and open it at http://192.168.1.100:8000 to create short links.", true);
      return;
    }

    const url = input.value.trim();
    if (!/^https?:\/\//i.test(url)) {
      setMsg("Start the URL with http:// or https://", true);
      return;
    }

    btn.disabled = true;
    btn.textContent = "Shortening...";
    try {
      const res = await fetch("/add-new-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(typeof data.detail === "string" ? data.detail : "That URL is not valid.");
      }
      shortLink.textContent = data.short_url;
      shortLink.href = data.short_url;
      copyBtn.textContent = "Copy";
      result.classList.add("show");
    } catch (err) {
      setMsg(err.message || "Could not reach the server. Check that it is running.", true);
    } finally {
      btn.disabled = false;
      btn.textContent = "Shorten";
    }
  });

  async function copyText(text) {
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return;
      } catch {
        // Fall back for browsers or origins where clipboard access is blocked.
      }
    }

    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();

    const copied = document.execCommand("copy");
    textarea.remove();
    if (!copied) {
      throw new Error("Clipboard access is unavailable.");
    }
  }

  copyBtn.addEventListener("click", async () => {
    const text = shortLink.textContent.trim();
    if (!text) {
      return;
    }

    try {
      await copyText(text);
      copyBtn.textContent = "Copied";
      setMsg("Short link copied to clipboard.");
    } catch {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(shortLink);
      selection.removeAllRanges();
      selection.addRange(range);
      copyBtn.textContent = "Press Ctrl+C";
      setMsg("Short link selected. Press Ctrl+C to copy.");
    }
  });
</script>
</body>
</html>
